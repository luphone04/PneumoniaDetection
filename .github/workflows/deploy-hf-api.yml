name: Deploy API to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: git lfs install

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://RichardLu:$HF_TOKEN@huggingface.co/spaces/RichardLu/PneumoniaAPI hf_space

          # Copy modular code
          cp -r src/ hf_space/
          cp -r api/ hf_space/
          mkdir -p hf_space/models
          cp models/best_model.pt hf_space/models/
          cp requirements.txt hf_space/

          # Copy Dockerfile to root
          cp api/Dockerfile hf_space/Dockerfile

          # Track large files with LFS
          cd hf_space
          git lfs track "*.pt"

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .gitattributes
          git add .
          git diff --staged --quiet || git commit -m "Auto-deploy from GitHub: ${{ github.sha }}"
          git push
