name: Deploy Streamlit to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'requirements-app.txt'
      - 'models/best_model.pt'
      - '.github/workflows/deploy-hf-app.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: git lfs install

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://RichardLu:$HF_TOKEN@huggingface.co/spaces/RichardLu/PneumoniaDetection hf_space

          # Copy modular code
          cp -r src/ hf_space/
          cp -r app/* hf_space/
          mkdir -p hf_space/models
          cp models/best_model.pt hf_space/models/
          # The Space installs requirements.txt: ship the pinned, CPU-only demo set
          cp requirements-app.txt hf_space/requirements.txt

          # Track large files with LFS
          cd hf_space
          git lfs track "*.pt"
          git lfs track "*.jpeg"
          git lfs track "*.jpg"
          git lfs track "*.png"

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .gitattributes
          git add .
          git diff --staged --quiet || git commit -m "Auto-deploy from GitHub: ${{ github.sha }}"
          git push
