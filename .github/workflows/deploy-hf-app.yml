name: Deploy Streamlit to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - 'hf_app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: git lfs install

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://RichardLu:$HF_TOKEN@huggingface.co/spaces/RichardLu/PneumoniaDetection hf_space
          cp -r hf_app/* hf_space/
          cd hf_space
          git lfs track "*.pt"
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git diff --staged --quiet || git commit -m "Auto-deploy from GitHub: ${{ github.sha }}"
          git push
